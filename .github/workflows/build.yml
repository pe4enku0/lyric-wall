# Builds the installers on GitHub's servers.
# Every push: the .exe (Windows) and the zipped .app (Mac) appear in the Actions tab as artifacts.
# A tag like v0.1.0: the same files are also published in Releases.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-exe
            files: dist/*.exe
          - os: macos-latest
            name: mac-app
            files: dist/*.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
      # Smoke tests: run the media helper once, then run the built app for 10 seconds and print its log.
      - name: Media helper test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: '"" | powershell.exe -NoProfile -ExecutionPolicy Bypass -File adapters/win-media.ps1'
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\win-unpacked\Lyric Wall.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Host "::warning::App did not exit in 60 s" }
          $log = "$env:APPDATA\Lyric Wall\lyric-wall.log"
          Get-Content $log
          if (Select-String -Path $log -Pattern '\[ERROR\]' -Quiet) { Write-Host "::warning::Errors in app log" }
      - name: Smoke test (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          "dist/mac-arm64/Lyric Wall.app/Contents/MacOS/Lyric Wall" --smoke-test || echo "::warning::App exited with error"
          log="$HOME/Library/Application Support/Lyric Wall/lyric-wall.log"
          cat "$log"
          if grep -q '\[ERROR\]' "$log"; then echo "::warning::Errors in app log"; fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
