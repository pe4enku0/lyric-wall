<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:">
<title>Lyric Wall</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="prefs.css">
</head>
<body>
<main>
  <header class="bar"><img src="../assets/icon-win.png" alt=""><h1>Lyric Wall <span id="ver" class="ver"></span></h1></header>
  <div class="content">
    <section>
      <div class="group">
        <div class="row col np">
          <div class="top">
            <img id="cover" alt="">
            <div class="meta"><div id="title"></div><div id="artist"></div></div>
          </div>
          <div class="prog"><span id="cur">0:00</span><div class="track"><i id="fill"></i></div><span id="dur">0:00</span></div>
          <div class="ctrl" id="ctrl">
            <button type="button" id="bPrev" aria-label="Previous" data-icon="prev"></button>
            <button type="button" class="pp" id="pp" aria-label="Play / Pause"></button>
            <button type="button" id="bNext" aria-label="Next" data-icon="next"></button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h3 data-i18n="control.app"></h3>
      <div class="group">
        <div class="row"><span class="ri" data-icon="monitor"></span><div class="rt"><b data-i18n="control.wallpaper"></b><small id="wallState" class="plain"></small></div>
          <button type="button" class="sw" id="optWall" role="switch" aria-checked="false"><b></b><i></i></button></div>
        <div class="row"><span class="ri" data-icon="globe"></span><div class="rt"><b data-i18n="control.language"></b></div><div id="optLang"></div></div>
        <div class="row" id="rowMode" hidden><span class="ri" data-icon="layout"></span><div class="rt"><b data-i18n="control.mode"></b></div><div id="optMode"></div></div>
        <div class="row"><span class="ri" data-icon="power"></span><div class="rt"><b data-i18n="control.loginItem"></b><small id="loginHint" class="plain" data-i18n="control.loginItemDev" hidden></small></div>
          <button type="button" class="sw" id="optLogin" role="switch" aria-checked="false"><b></b><i></i></button></div>
        <div class="row click" id="bLook"><span class="ri" data-icon="palette"></span><div class="rt"><b data-i18n="control.look"></b></div><span class="chev" data-icon="chevron" data-size="16"></span></div>
      </div>
    </section>

    <footer>
      <p id="hint"></p>
      <div class="btns">
        <button type="button" class="btn" id="bLog" data-i18n="control.openLog"></button>
        <button type="button" class="btn" id="bQuit" data-i18n="control.quit"></button>
      </div>
    </footer>
  </div>
</main>
<script src="common.js"></script>
<script src="icons.js"></script>
<script src="prefs.js"></script>
<script src="control.js"></script>
</body>
</html>
