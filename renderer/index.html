<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:">
<title>Lyric Wall</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/archivo/wdth.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource/vt323/latin.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vhs.css">
</head>
<body>
<!-- One set of parts (cover, track info, progress, buttons, clock, lyrics, Sound, Up next) in two arrangements:
     data-layout="a" (side by side) and "b" (centered). data-platform="mac" | "win" changes only the look. -->
<div class="stage themed" id="stage" data-theme="default" data-platform="mac" data-layout="a" data-state="idle">
  <div class="bgimg" id="bgimg"></div><div class="dim" id="dim"></div>
  <div class="glow" id="glow"></div>
  <canvas id="snow" width="1280" height="800"></canvas>
  <div class="grain" id="grain"></div>

  <div class="ui" id="ui">
    <div class="leftcol">
      <div class="player" id="player">
        <div class="pbg glass" data-fly></div>
        <!-- VHS theme only: the recorder's state (PLAY / PAUSE / STOP) and the tape counter. -->
        <div class="vcr" data-fly><span class="vst"></span><span id="vcrCount">00:00:00</span></div>
        <div class="cover" id="cover" data-act="cover" data-fly>
          <img id="artA" alt="">
          <img id="artB" alt="" class="out">
          <i class="glitch" id="glitch"></i>
          <div class="empty" data-icon="noteOutline" data-size="40"></div>
        </div>
        <div class="meta" data-fly>
          <div class="status"><span data-icon="note" data-size="13"></span><span id="status"></span></div>
          <h2><span id="title"></span><i id="explicit" hidden>E</i></h2>
          <div class="artist" id="artist"></div>
        </div>
        <div class="prog" data-fly>
          <div class="bar slider" data-act="progress"><i id="fill"></i><b id="knob"></b><span class="segs" id="progSegs"></span></div>
          <span id="cur">–:––</span><span id="rem">–:––</span>
        </div>
        <div class="transport" data-fly>
          <span class="tb like" id="like" data-act="like"></span>
          <span class="tb skip" data-act="prev" data-icon="prev"></span>
          <span class="tb pp" id="pp" data-act="pp"></span>
          <span class="tb skip" data-act="next" data-icon="next"></span>
          <span class="tb more" data-act="more" data-icon="more"></span>
        </div>
        <div class="util" data-fly>
          <div class="vol" id="volBox">
            <span class="spk" data-act="mute" data-icon="volume" data-size="20"></span>
            <div class="vb slider" data-act="volume"><i id="volBar"></i><b id="volKnob"></b><span class="segs" id="volSegs"></span></div>
          </div>
          <span class="lyb" id="lyb" data-act="lyrics" data-icon="lyrics" data-size="18"></span>
          <span class="dev" data-act="device"><span data-icon="device" data-size="18"></span><span class="devl" id="device"></span><span class="caret" data-icon="caret" data-size="14"></span></span>
        </div>
        <div class="toast" id="toast" hidden></div>
      </div>

      <div class="cards">
        <div class="glass card sound" id="sound" data-fade>
          <div class="ch"><span class="k"><span data-icon="bars" data-size="16"></span><span data-i18n="ui.sound"></span></span><small id="live"></small></div>
          <canvas id="viz" width="200" height="100"></canvas>
          <div class="lr" aria-hidden="true"><span>L</span><span>R</span></div><!-- VHS only -->
        </div>
        <div class="glass card upnext" id="upnext" data-fade>
          <div class="ch"><span class="k"><span data-icon="queue" data-size="16"></span><span data-i18n="ui.upNext"></span></span><small id="qn"></small><span class="shuf" id="mode" data-act="shuffle" data-icon="shuffle" data-size="16" hidden></span></div>
          <div class="q" id="queue"></div>
        </div>
      </div>
    </div>

    <div class="rightcol">
      <div class="clock"><div class="time" id="time" data-fly></div><div class="date" id="date" data-fly></div></div>
      <div class="lyr" id="lyr" data-fade>
        <div class="vp" id="vp"><ul id="lines"></ul></div>
        <div class="quiet" id="quiet" hidden>
          <div class="qt" id="quietTitle"></div>
          <div class="qn"><span data-icon="lyricsOff" data-size="20"></span><span id="quietNote"></span></div>
        </div>
      </div>
    </div>
  </div>
  <!-- VHS theme only (vhs.css): scan lines, the tracking band and the vignette over everything. -->
  <div class="vhsfx" aria-hidden="true"><i class="tracking"></i></div>
</div>

<script src="common.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
