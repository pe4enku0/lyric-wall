<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:">
<title>Lyric Wall</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/archivo/wdth.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="prefs.css">
</head>
<body>
<!-- Every option is a row: icon (Windows only), name and hint, control. app chooses the control per system:
     segmented buttons on the Mac, drop-down lists on Windows (see settings.js). -->
<main>
  <header class="bar"><img src="../assets/icon-win.png" alt=""><h1 data-i18n="settings.title"></h1></header>
  <div class="content">
    <h2 class="page-title" data-i18n="settings.page"></h2>

    <section>
      <h3 data-i18n="sec.layout"></h3>
      <div class="group">
        <div class="row"><span class="ri" data-icon="layout"></span><div class="rt"><b data-i18n="look.layout"></b><small data-i18n="desc.layout"></small></div><div id="layout"></div></div>
      </div>
    </section>

    <section>
      <h3 data-i18n="look.background"></h3>
      <div class="group">
        <div class="row"><span class="ri" data-icon="image"></span><div class="rt"><b data-i18n="look.style"></b><small data-i18n="desc.bg"></small></div><div id="bgStyle"></div></div>
        <div class="row" id="rowColor"><div class="swatches" id="swatches" role="radiogroup"></div><input type="color" id="customColor" hidden></div>
        <div class="row" id="rowThemeBg"><div class="rt"><small class="plain" data-i18n="look.themeBg"></small></div></div>
        <div class="row" id="rowPic">
          <div class="pic"><i class="thumb" id="thumb"></i><span id="picName"></span>
            <label class="btn" id="pickBtn"><span id="pickText"></span><input id="pick" type="file" accept="image/*" hidden></label></div>
        </div>
        <div class="row" id="rowBlur"><span class="ri" data-icon="blur"></span><div class="rt"><b data-i18n="look.blur"></b></div><div class="range"><input id="blur" type="range" min="0" max="40" step="1"></div></div>
        <div class="row" id="rowDim"><span class="ri" data-icon="sun"></span><div class="rt"><b data-i18n="look.dim"></b></div><div class="range"><input id="dimR" type="range" min="0" max="80" step="1"></div></div>
      </div>
      <p class="err" id="pickErr" data-i18n="look.badImage" hidden></p>
    </section>

    <section>
      <h3 data-i18n="sec.snow"></h3>
      <div class="group">
        <div class="row"><span class="ri" data-icon="snow"></span><div class="rt"><b data-i18n="snow.show"></b><small data-i18n="desc.snow"></small></div>
          <button type="button" class="sw" id="snowOn" role="switch" aria-checked="true"><b></b><i></i></button></div>
        <div class="row snowdep"><span class="ri" data-icon="speed"></span><div class="rt"><b data-i18n="snow.speed"></b></div>
          <div class="range"><span data-i18n="snow.slow"></span><input id="spd" type="range" min="0.2" max="3" step="0.1"><span data-i18n="snow.fast"></span></div></div>
        <div class="row snowdep"><span class="ri" data-icon="amount"></span><div class="rt"><b data-i18n="snow.amount"></b></div>
          <div class="range"><span data-i18n="snow.few"></span><input id="cnt" type="range" min="10" max="300" step="10"><span data-i18n="snow.many"></span></div></div>
      </div>
    </section>

    <section>
      <h3 data-i18n="look.theme"></h3>
      <div class="group">
        <div class="row col">
          <div class="rhead"><span class="ri" data-icon="palette"></span><div class="rt"><b data-i18n="look.theme"></b><small data-i18n="desc.theme"></small></div></div>
          <div class="themes" id="themes" role="radiogroup"></div>
        </div>
      </div>
    </section>

    <section>
      <h3 data-i18n="web.title"></h3>
      <div class="group">
        <div class="row col">
          <div class="rt"><small class="plain" data-i18n="web.intro"></small></div>
          <ol class="steps">
            <li><span data-i18n="web.step1"></span> <button type="button" class="link" id="webDash">developer.spotify.com</button></li>
            <li><span data-i18n="web.step2"></span> <code id="webRedirect"></code></li>
            <li data-i18n="web.step3"></li>
            <li data-i18n="web.step4"></li>
          </ol>
          <div class="webrow" id="webOut"><input type="text" id="webId" placeholder="Client ID" spellcheck="false" autocomplete="off"><button type="button" class="btn primary" id="webLogin" data-i18n="web.login"></button></div>
          <div class="webrow" id="webIn" hidden><span id="webUser"></span><button type="button" class="btn" id="webLogout" data-i18n="web.logout"></button></div>
          <p class="err" id="webErr" hidden></p>
        </div>
      </div>
    </section>

    <section>
      <h3 data-i18n="look.power"></h3>
      <div class="group">
        <div class="row"><span class="ri" data-icon="speed"></span><div class="rt"><b data-i18n="look.fps"></b></div><div id="fps"></div></div>
        <div class="row"><span class="ri" data-icon="battery"></span><div class="rt"><b data-i18n="look.pauseOnBattery"></b></div>
          <button type="button" class="sw" id="battery" role="switch" aria-checked="false"><b></b><i></i></button></div>
      </div>
      <p class="note" data-i18n="look.pauseHint"></p>
    </section>
  </div>
</main>
<script src="common.js"></script>
<script src="icons.js"></script>
<script src="prefs.js"></script>
<script src="settings.js"></script>
</body>
</html>
