<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:">
<title>Lyric Wall</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/index.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <header class="top">
    <h1 data-i18n="look.title"></h1>
    <p data-i18n="look.subtitle"></p>
  </header>

  <div class="set">
    <section>
      <h3 data-i18n="look.background"></h3>
      <div class="sw" id="sw" role="radiogroup"></div>
    </section>
    <section class="imgset" id="imgset">
      <h3 data-i18n="look.picture"></h3>
      <label class="pick"><span data-i18n="look.choose"></span><input class="vh" id="pick" type="file" accept="image/*"></label>
      <p class="err" id="pickErr" data-i18n="look.badImage" hidden></p>
      <div class="sl"><div><label for="blur" data-i18n="look.blur"></label><output id="blurO"></output></div><input id="blur" type="range" min="0" max="40" step="1"></div>
      <div class="sl"><div><label for="dimR" data-i18n="look.dim"></label><output id="dimO"></output></div><input id="dimR" type="range" min="0" max="80" step="1"></div>
    </section>
    <section>
      <h3><label for="spd" data-i18n="look.snowSpeed"></label><output id="spdO"></output></h3>
      <input id="spd" type="range" min="0" max="3" step="0.1">
      <div class="hint"><span data-i18n="look.still"></span><span data-i18n="look.blizzard"></span></div>
    </section>
    <section>
      <h3><label for="cnt" data-i18n="look.snowCount"></label><output id="cntO"></output></h3>
      <input id="cnt" type="range" min="0" max="300" step="10">
      <div class="hint"><span data-i18n="look.none"></span><span>300</span></div>
    </section>
    <section class="wide">
      <h3 data-i18n="look.sound"></h3>
      <label class="chk"><input type="checkbox" id="audio"><span data-i18n="look.audioReactive"></span></label>
      <p class="note" id="audioNote"></p>
    </section>
    <section class="wide">
      <h3 data-i18n="web.title"></h3>
      <p class="note" data-i18n="web.intro"></p>
      <ol class="steps">
        <li><span data-i18n="web.step1"></span> <button type="button" class="link" id="webDash">developer.spotify.com</button></li>
        <li><span data-i18n="web.step2"></span> <code id="webRedirect"></code></li>
        <li data-i18n="web.step3"></li>
        <li data-i18n="web.step4"></li>
      </ol>
      <div class="webrow" id="webOut"><input id="webId" placeholder="Client ID" spellcheck="false" autocomplete="off"><button type="button" class="pick" id="webLogin" data-i18n="web.login"></button></div>
      <div class="webrow" id="webIn" hidden><span id="webUser"></span><button type="button" class="pick" id="webLogout" data-i18n="web.logout"></button></div>
      <p class="err" id="webErr" hidden></p>
    </section>
    <section class="wide">
      <h3 data-i18n="look.power"></h3>
      <div class="fps"><span data-i18n="look.fps"></span><div class="seg" id="fps"><button type="button" data-v="30">30</button><button type="button" data-v="20">20</button><button type="button" data-v="15">15</button></div></div>
      <label class="chk"><input type="checkbox" id="battery"><span data-i18n="look.pauseOnBattery"></span></label>
      <p class="note" data-i18n="look.pauseHint"></p>
    </section>
  </div>
</main>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
